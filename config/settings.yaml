# config/settings.yaml
# Minimal runtime configuration for the gui2mcp agent.

# =========================================================
# RUNTIME PROFILE
# =========================================================
runtime:
  # vm  — data collection in Ubuntu VM (Xvfb :99)
  # host — native display :0
  profile: "vm"

# =========================================================
# DISPLAY / SCREEN GEOMETRY
# =========================================================
environment:
  display:
    display_num: ":99"
    screen:
      width: 1280
      height: 1024
      depth: 24

# =========================================================
# LLM API FALLBACK DEFAULTS
# Used by OpenAIAnnotatorClient if not specified in llm/*.yaml
# =========================================================
teacher:
  api:
    timeout: 30
    max_retries: 3
    retry_delay: 2

# =========================================================
# PROFILE OVERRIDES
# =========================================================
overrides:
  vm:
    environment:
      display:
        display_num: ":99"
        screen:
          width: 1280
          height: 1024
          depth: 24

  host:
    environment:
      display:
        display_num: ":0"
        screen:
          width: 1920
          height: 1080
          depth: 24
