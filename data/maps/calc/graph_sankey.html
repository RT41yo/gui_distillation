<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GUI Exploration Sankey</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #fafafa;
      color: #222;
    }
    header {
      padding: 22px 28px 8px 28px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      margin: 8px 0 0 0;
      color: #555;
      font-size: 14px;
    }
    #chart {
      width: 100vw;
      height: calc(100vh - 90px);
    }
  </style>
</head>
<body>
<header>
  <h1>GUI Exploration Flow by Depth and State Type</h1>
  <p>Aggregated confirmed transitions: depth/kind → depth/kind</p>
</header>
<div id="chart"></div>
<script>
const data = [{
  type: "sankey",
  arrangement: "snap",
  node: {
    pad: 22,
    thickness: 18,
    line: { color: "rgba(0,0,0,0.25)", width: 0.5 },
    label: ["D0 · main", "D1 · dialog", "D1 · main", "D1 · menu", "D1 · window_overlay", "D2 · main", "D2 · window_overlay"]
  },
  link: {
    source: [0, 0, 0, 0, 3, 3, 4, 4, 4, 2, 2, 2, 2, 1],
    target: [4, 3, 1, 2, 5, 0, 5, 6, 0, 4, 3, 1, 0, 2],
    value: [6, 1, 1, 2, 3, 1, 2, 6, 1, 12, 2, 2, 2, 1]
  }
}];

const layout = {
  paper_bgcolor: "#fafafa",
  plot_bgcolor: "#fafafa",
  font: { size: 13 },
  margin: { l: 30, r: 30, t: 20, b: 30 }
};

Plotly.newPlot("chart", data, layout, {responsive: true});
</script>
</body>
</html>
