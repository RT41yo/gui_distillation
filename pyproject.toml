[project]
name = "ui-explorer"
version = "0.1.0"
description = "A11Y-first UI state exploration engine"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "pyautogui>=0.9.54",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "matplotlib>=3.8",
  "networkx>=3.2",
]

[project.scripts]
ui-explorer-visualize-graph = "ui_explorer.cli.visualize_graph:main"
ui-explorer-visualize-graph-extra = "ui_explorer.cli.visualize_graph_extra:main"
ui-explorer-visualize-graph-interactive = "ui_explorer.cli.visualize_graph_interactive:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
